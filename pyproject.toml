[project]
name = "temporal-homelab-monitor"
version = "0.1.0"
description = "Homelab host monitor built on Temporal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.7",
    "psutil>=5.9",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
